[package]
name = "runinator-workspace-storage"
version.workspace = true
edition = "2024"
description = "Paged copy-on-write workspace with FastCDC, Merkle radix maps, immutable packs, and Merkle-aware OCI images"
license = "MIT"

[dependencies]
runinator-models = { path = "../runinator-models" }
anyhow = "1"
blake3 = "1.8"
fastcdc = "=5.0.0"
flate2 = "1"
fs2 = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tar = "0.4"
thiserror = "2"
zstd = "0.13"

[dev-dependencies]
proptest = "1"
