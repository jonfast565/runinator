[package]
name = "runinator-provider-db"
version.workspace = true
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = { version = "1", features = ["serde"] }
# `bigdecimal` is what makes DECIMAL/NUMERIC decodable at all — without it sqlx has no rust type
# for them and every value renders as `<unsupported:…>`.
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "bigdecimal",
    "chrono",
    "uuid",
    "json",
] }
# version is pinned by sqlx 0.8's own `bigdecimal 0.4` dependency; they must agree or the decode
# impls do not apply.
bigdecimal = "0.4"
mongodb = { version = "3", optional = true }

runinator-plugin = { path = "../runinator-plugin" }
runinator-data-export = { path = "../runinator-data-export" }
runinator-models = { path = "../runinator-models" }

[features]
default = ["sqlite", "postgres", "mysql", "mongo"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
# mongodb is a first-class store backend, not an add-on, so it ships by default. its `bson`
# dependency hard-enables `serde_json/preserve_order`, which cargo unifies across the workspace —
# that is intended, not a hazard to route around. the domain and wire type is
# `runinator_models::value::Value`, whose `Map` is its own `BTreeMap`, so the ordering of every
# value that crosses a workflow, the reducer, or the database is unaffected by construction. what
# `preserve_order` reaches is raw `serde_json::Value` inside provider internals, where insertion
# order is the better answer anyway: a query result now reports its columns in the order they were
# selected instead of alphabetically.
mongo = ["dep:mongodb"]

[dev-dependencies]
tempfile = "3"
