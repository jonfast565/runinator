# engines for the live connector tests in tests/live.rs. ports are offset from the defaults so
# this never collides with a local postgres/mysql/mongo install.
#
#   docker compose -f runinator-provider-db/tests/docker-compose.yml up -d
#   RUNINATOR_TEST_POSTGRES_URL=postgres://runi:runi@127.0.0.1:55432/runi \
#   RUNINATOR_TEST_MYSQL_URL=mysql://root:runi@127.0.0.1:53306/runi \
#   RUNINATOR_TEST_MONGO_URL=mongodb://127.0.0.1:57017/runi \
#     cargo test -p runinator-provider-db --test live -- --ignored
#   docker compose -f runinator-provider-db/tests/docker-compose.yml down -v

name: runinator-provider-db-tests

services:
  postgres:
    image: postgres:16
    container_name: runi-db-pg
    environment:
      POSTGRES_USER: runi
      POSTGRES_PASSWORD: runi
      POSTGRES_DB: runi
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runi -d runi"]
      interval: 2s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11
    container_name: runi-db-mysql
    environment:
      MARIADB_ROOT_PASSWORD: runi
      MARIADB_DATABASE: runi
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:7
    container_name: runi-db-mongo
    ports:
      - "57017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 2s
      timeout: 3s
      retries: 30
