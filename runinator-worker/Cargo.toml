[package]
name = "runinator-worker"
version.workspace = true
edition = "2024"

[dependencies]
log = "0.4"
tracing = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "blocking"] }
zip = { version = "7.2", default-features = false }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
x509-parser = "0.18"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
runinator-auth = { path = "../runinator-auth" }

runinator-comm = { path = "../runinator-comm" }
runinator-plugin = { path = "../runinator-plugin" }
runinator-models = { path = "../runinator-models" }
runinator-observability = { path = "../runinator-observability" }
runinator-platform = { path = "../runinator-platform" }
runinator-secrets = { path = "../runinator-secrets" }
opentelemetry = "0.32"
runinator-api = { path = "../runinator-api" }
runinator-broker = { path = "../runinator-broker", default-features = false }
runinator-service-bootstrap = { path = "../runinator-service-bootstrap", default-features = false }
runinator-provider-catalog = { path = "../runinator-provider-catalog", default-features = false }

[features]
default = ["http", "tcp", "db-sqlite", "db-postgres", "db-mysql", "db-mongo"]
http = ["runinator-broker/http"]
tcp = ["runinator-broker/tcp"]
db-sqlite = ["runinator-provider-catalog/db-sqlite"]
db-postgres = ["runinator-provider-catalog/db-postgres"]
db-mysql = ["runinator-provider-catalog/db-mysql"]
db-mongo = ["runinator-provider-catalog/db-mongo"]
kafka = ["runinator-broker/kafka"]
rabbitmq = ["runinator-broker/rabbitmq"]
# enables `--broker-backend ws`, relaying through runinator-ws's /ws/desktop-worker endpoint instead
# of connecting to the broker directly — for a worker that only has network access to the web
# service (e.g. running outside the cluster's trusted network).
ws = ["runinator-broker/ws"]

[dev-dependencies]
tempfile = "3"
