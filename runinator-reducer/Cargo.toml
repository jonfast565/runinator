[package]
name = "runinator-reducer"
version.workspace = true
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1.18", features = ["v4", "v7"] }

runinator-comm = { path = "../runinator-comm" }
runinator-store = { path = "../runinator-store" }
runinator-models = { path = "../runinator-models" }
runinator-utilities = { path = "../runinator-utilities" }
runinator-workflows = { path = "../runinator-workflows" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
# exposes the in-memory `FakeStore` so other crates can drive handlers without a database.
test-support = []
