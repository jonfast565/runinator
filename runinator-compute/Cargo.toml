[package]
name = "runinator-compute"
version.workspace = true
edition = "2024"

[dependencies]
runinator-models = { path = "../runinator-models" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.18"
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }

[dev-dependencies]
# test-only: the serialization round-trip between a yield and a resume is the property the vm's
# resumability rests on, so it is asserted against real json rather than a clone.
serde_json = "1"
