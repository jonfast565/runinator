[package]
name = "runinator-provider-support"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
runinator-models = { path = "../runinator-models" }
runinator-plugin = { path = "../runinator-plugin" }
portable-pty = "0.9.0"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
