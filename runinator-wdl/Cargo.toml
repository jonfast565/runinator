[package]
name = "runinator-wdl"
version.workspace = true
edition = "2024"

[dependencies]
runinator-models = { path = "../runinator-models" }
runinator-workflows = { path = "../runinator-workflows" }
runinator-wdl-syntax = { path = "../runinator-wdl-syntax" }
runinator-wdl-sema = { path = "../runinator-wdl-sema" }
runinator-wdl-codegen = { path = "../runinator-wdl-codegen" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
runinator-provider-catalog = { path = "../runinator-provider-catalog" }
