[package]
name = "runinator-desktop-agent"
version.workspace = true
edition = "2024"

[dependencies]
base64 = "0.23"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
eframe = "0.36"
tray-icon = "0.25"
open = "5"
# must match the feature set tauri-plugin-dialog picks for rfd. rfd's build script panics when
# `gtk3` and `xdg-portal` are both on, which cargo's feature unification would do to any linux
# build that has this crate and runinator-command-center in the same invocation.
rfd = { version = "0.17", default-features = false, features = [
    "gtk3",
    "common-controls-v6",
] }
notify-rust = "4"
png = "0.18"
glob = "0.3"
zip = { version = "8.6", default-features = false }

runinator-api = { path = "../runinator-api" }
runinator-comm = { path = "../runinator-comm" }
runinator-models = { path = "../runinator-models" }
runinator-hash = { path = "../runinator-hash" }
runinator-plugin = { path = "../runinator-plugin" }
runinator-provider-catalog = { path = "../runinator-provider-catalog" }
runinator-provider-console = { path = "../runinator-provider-console" }
runinator-provider-local-files = { path = "../runinator-provider-local-files" }
runinator-observability = { path = "../runinator-observability" }
runinator-tui = { path = "../runinator-tui" }
runinator-platform = { path = "../runinator-platform" }
runinator-worker = { path = "../runinator-worker", features = ["ws"] }

# keep gpu-allocator on the same windows-rs line as wgpu-hal. its broad compatibility range can
# otherwise resolve to tauri's 0.61 line and produce incompatible Direct3D COM traits.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false }
