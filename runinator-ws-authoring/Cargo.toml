[package]
name = "runinator-ws-authoring"
version.workspace = true
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
base64 = "0.22"
chrono = "0.4"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-util = { version = "0.7", features = ["io"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1.18", features = ["v4"] }

runinator-blob-core = { path = "../runinator-blob-core" }
runinator-adapter-contract = { path = "../runinator-adapter-contract" }
runinator-adapter-client = { path = "../runinator-adapter-client" }
runinator-broker-core = { path = "../runinator-broker-core" }
runinator-engine = { path = "../runinator-engine" }
runinator-models = { path = "../runinator-models" }
runinator-store = { path = "../runinator-store" }
runinator-provider-catalog = { path = "../runinator-provider-catalog", default-features = false }
runinator-pack-wire = { path = "../runinator-pack-wire" }
runinator-secrets = { path = "../runinator-secrets" }
runinator-rexrap = { path = "../runinator-rexrap" }
runinator-rexrap-ide = { path = "../runinator-rexrap-ide" }
runinator-workflows = { path = "../runinator-workflows" }
runinator-ws-core = { path = "../runinator-ws-core" }
runinator-ws-middleware = { path = "../runinator-ws-middleware" }

[features]
db-sqlite = ["runinator-provider-catalog/db-sqlite"]
db-postgres = ["runinator-provider-catalog/db-postgres"]
db-mariadb = ["runinator-provider-catalog/db-mariadb"]
