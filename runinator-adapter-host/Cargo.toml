[package]
name = "runinator-adapter-host"
version.workspace = true
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
constant_time_eq = "0.6"
hmac = "0.13"
libloading = "0.9"
runinator-adapter-contract = { path = "../runinator-adapter-contract" }
runinator-github = { path = "../runinator-github" }
runinator-jira = { path = "../runinator-jira" }
runinator-models = { path = "../runinator-models" }
runinator-platform = { path = "../runinator-platform" }
runinator-provider-support = { path = "../runinator-provider-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
