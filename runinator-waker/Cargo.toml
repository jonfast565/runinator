[package]
name = "runinator-waker"
version.workspace = true
edition = "2024"

[dependencies]
tracing = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }

runinator-models = { path = "../runinator-models" }
runinator-utilities = { path = "../runinator-utilities" }
opentelemetry = "0.32"
runinator-broker = { path = "../runinator-broker", default-features = false }
runinator-service-bootstrap = { path = "../runinator-service-bootstrap", default-features = false }
runinator-api = { path = "../runinator-api" }

[features]
default = ["http", "tcp"]
http = ["runinator-broker/http", "runinator-service-bootstrap/http"]
tcp = ["runinator-broker/tcp", "runinator-service-bootstrap/tcp"]
kafka = ["runinator-broker/kafka", "runinator-service-bootstrap/kafka"]
rabbitmq = ["runinator-broker/rabbitmq", "runinator-service-bootstrap/rabbitmq"]
