[package]
name = "runinator-ws"
version.workspace = true
edition = "2024"

[dependencies]
log = "0.4"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tower-http = { version = "0.6.2", features = ["cors", "catch-panic", "timeout"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"], optional = true }
# used only to install a process-default rustls CryptoProvider at startup (see main.rs).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
tracing = "0.1"
metrics = "0.24"
opentelemetry = "0.32"

runinator-blob = { path = "../runinator-blob", default-features = false, features = ["client"] }
runinator-broker = { path = "../runinator-broker", default-features = false }
runinator-service-bootstrap = { path = "../runinator-service-bootstrap", default-features = false }
runinator-ws-core = { path = "../runinator-ws-core" }
runinator-ws-middleware = { path = "../runinator-ws-middleware" }
runinator-ws-identity = { path = "../runinator-ws-identity" }
runinator-ws-authoring = { path = "../runinator-ws-authoring" }
runinator-ws-runtime = { path = "../runinator-ws-runtime" }
runinator-engine = { path = "../runinator-engine" }
runinator-runtime = { path = "../runinator-runtime" }
runinator-database = { path = "../runinator-database", default-features = false }
runinator-db-cli = { path = "../runinator-db-cli", default-features = false }
runinator-models = { path = "../runinator-models" }
runinator-comm = { path = "../runinator-comm" }
runinator-observability = { path = "../runinator-observability" }
runinator-platform = { path = "../runinator-platform" }
runinator-secrets = { path = "../runinator-secrets" }
runinator-store = { path = "../runinator-store" }
runinator-workflows = { path = "../runinator-workflows" }
runinator-provisioner = { path = "../runinator-provisioner" }
runinator-rexrap = { path = "../runinator-rexrap" }

[dev-dependencies]
async-trait = "0.1"
base64 = "0.22"
runinator-auth = { path = "../runinator-auth" }
# enable the engine's in-crate test hooks (forced-failure injection, test helpers) so the
# result-consumer/repository integration tests can drive engine behavior. dev-only, so normal
# builds never compile the hooks in.
runinator-engine = { path = "../runinator-engine", features = ["test-support"] }
# the publish path's client half: the tests archive a real package directory rather than hand-rolling
# a zip, so what they upload is exactly what `runinatorctl functions publish` would.
runinator-pack = { path = "../runinator-pack" }
# built-in provider metadata, which the server seeds at startup and a bare test database lacks.
runinator-provider-catalog = { path = "../runinator-provider-catalog" }

[features]
default = ["sqlite", "http", "tcp", "ws"]
sqlite = ["runinator-database/sqlite", "runinator-db-cli/sqlite", "runinator-service-bootstrap/sqlite", "runinator-ws-authoring/db-sqlite"]
postgres = ["runinator-database/postgres", "runinator-db-cli/postgres", "runinator-service-bootstrap/postgres", "runinator-ws-authoring/db-postgres"]
mysql = ["runinator-database/mysql", "runinator-db-cli/mysql", "runinator-service-bootstrap/mysql", "runinator-ws-authoring/db-mysql"]
mongo = ["runinator-ws-authoring/db-mongo"]
http = ["runinator-broker/http", "runinator-service-bootstrap/http", "dep:reqwest"]
tcp = ["runinator-broker/tcp", "runinator-service-bootstrap/tcp"]
kafka = ["runinator-broker/kafka", "runinator-service-bootstrap/kafka"]
rabbitmq = ["runinator-broker/rabbitmq", "runinator-service-bootstrap/rabbitmq"]
# enables the real `WsBroker` client for the authenticated broker relay.
ws = ["runinator-broker/ws", "runinator-service-bootstrap/ws"]
# cloud builds: enable the kube-rs node provisioner backend.
kubernetes = ["runinator-provisioner/kubernetes"]
