[package]
name = "runinator-secrets"
version.workspace = true
edition = "2024"

[dependencies]
chacha20poly1305 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.11"
uuid = { version = "1.26", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
