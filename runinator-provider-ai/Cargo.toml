[package]
name = "runinator-provider-ai"
version.workspace = true
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

runinator-plugin = { path = "../runinator-plugin" }
runinator-models = { path = "../runinator-models" }
runinator-provider-support = { path = "../runinator-provider-support" }
runinator-platform = { path = "../runinator-platform" }

[dev-dependencies]
uuid = { version = "1.18", features = ["v4", "v7"] }
