[package]
name = "runinator-service-bootstrap"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
runinator-blob = { path = "../runinator-blob", default-features = false, features = ["client"] }
runinator-broker = { path = "../runinator-broker", default-features = false }
runinator-db-cli = { path = "../runinator-db-cli", default-features = false }
runinator-platform = { path = "../runinator-platform" }

[features]
default = ["sqlite", "http", "tcp"]
sqlite = ["runinator-db-cli/sqlite"]
postgres = ["runinator-db-cli/postgres"]
mysql = ["runinator-db-cli/mysql"]
http = ["runinator-broker/http"]
tcp = ["runinator-broker/tcp"]
kafka = ["runinator-broker/kafka"]
rabbitmq = ["runinator-broker/rabbitmq"]
ws = ["runinator-broker/ws"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
