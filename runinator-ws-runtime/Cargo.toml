[package]
name = "runinator-ws-runtime"
version.workspace = true
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
metrics = "0.24"
mime_guess = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1.18", features = ["v4"] }

runinator-blob-core = { path = "../runinator-blob-core" }
runinator-broker-core = { path = "../runinator-broker-core" }
runinator-comm = { path = "../runinator-comm" }
runinator-database = { path = "../runinator-database", default-features = false }
runinator-engine = { path = "../runinator-engine" }
runinator-models = { path = "../runinator-models" }
runinator-store = { path = "../runinator-store" }
runinator-provisioner = { path = "../runinator-provisioner" }
runinator-supervisor = { path = "../runinator-supervisor" }
runinator-utilities = { path = "../runinator-utilities" }
runinator-workflows = { path = "../runinator-workflows" }
runinator-ws-core = { path = "../runinator-ws-core" }
runinator-ws-middleware = { path = "../runinator-ws-middleware" }

# no broker-backend features here: this crate has no `cfg(feature)` code, and `runinator-ws`'s
# kafka/rabbitmq forwards already select the backend on the shared `runinator-broker` build.
