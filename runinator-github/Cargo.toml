[package]
name = "runinator-github"
version.workspace = true
edition = "2024"

[dependencies]
runinator-models = { path = "../runinator-models" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
