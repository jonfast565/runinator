[package]
name = "runinator-ctl"
version.workspace = true
edition = "2024"

[[bin]]
name = "runinatorctl"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.30"
reedline = "0.50.0"
runinator-api = { path = "../runinator-api" }
runinator-comm = { path = "../runinator-comm" }
runinator-models = { path = "../runinator-models" }
runinator-pack = { path = "../runinator-pack", default-features = false }
runinator-provider-catalog = { path = "../runinator-provider-catalog", default-features = false }
runinator-utilities = { path = "../runinator-utilities" }
runinator-wdl = { path = "../runinator-wdl" }
runinator-workflows = { path = "../runinator-workflows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[features]
default = ["db-sqlite", "db-postgres", "db-mysql", "db-mongo"]
db-sqlite = ["runinator-pack/db-sqlite", "runinator-provider-catalog/db-sqlite"]
db-postgres = ["runinator-pack/db-postgres", "runinator-provider-catalog/db-postgres"]
db-mysql = ["runinator-pack/db-mysql", "runinator-provider-catalog/db-mysql"]
db-mongo = ["runinator-pack/db-mongo", "runinator-provider-catalog/db-mongo"]

# both the console's output pane and the mcp server take the process's own stdout away from the
# command modules; see src/tui/capture.rs and src/commands/mcp/capture.rs for why it is done under
# them rather than in them. moving a standard stream is the one part that is per-platform.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    # CreateFileW and CreatePipe both name SECURITY_ATTRIBUTES in their signatures.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
