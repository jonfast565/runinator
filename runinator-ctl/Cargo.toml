[package]
name = "runinator-ctl"
version.workspace = true
edition = "2024"

[[bin]]
name = "runinatorctl"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.30"
reedline = "0.50.0"
runinator-api = { path = "../runinator-api" }
runinator-comm = { path = "../runinator-comm" }
runinator-models = { path = "../runinator-models" }
runinator-pack = { path = "../runinator-pack" }
runinator-provider-catalog = { path = "../runinator-provider-catalog" }
runinator-utilities = { path = "../runinator-utilities" }
runinator-wdl = { path = "../runinator-wdl" }
runinator-workflows = { path = "../runinator-workflows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

# the console's output pane redirects the process's own stdout into itself, which is a file
# descriptor operation; see src/tui/capture.rs for why it is done there rather than in the command
# modules. windows falls back to the plain prompt, so it needs none of this.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
