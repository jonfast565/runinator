name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # the dialect-parity suites in runinator-database and the live connector tests in
    # runinator-provider-db skip themselves unless these are reachable, so CI brings them up
    # rather than running a sqlite-only subset of the suite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runi
          POSTGRES_PASSWORD: runi
          POSTGRES_DB: runi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runi -d runi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: runi
          MARIADB_DATABASE: runi
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      RUNINATOR_TEST_POSTGRES_URL: postgres://runi:runi@127.0.0.1:5432/runi
      RUNINATOR_TEST_MYSQL_URL: mysql://root:runi@127.0.0.1:3306/runi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # the workspace includes runinator-command-center/src-tauri and the tray/dialog stack in
      # runinator-desktop-agent, so a workspace-wide build needs the same gtk/webkit headers the
      # release build installs.
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            php-cli \
            pkg-config

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run workspace tests
        run: cargo test --workspace

  # the two-image job: mysql and mariadb disagree in ways no single image would catch, so anything
  # that only a live engine can check runs here against both.
  #
  # runinator-provider-db's connectors are the original reason — mariadb reports a `json` column as
  # BLOB, mysql 8 uppercases its `information_schema` labels and serves them as VARBINARY — and
  # running the suite against both is what keeps `connector/sql/decode.rs` honest. The store's
  # migrations ride along for the same reason: they are dialect-specific sql that the mariadb-only
  # main job cannot vet. The job name is kept as-is because required status checks reference it.
  db-connectors:
    name: DB connectors (${{ matrix.mysql_image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mysql_image: [mariadb:11, mysql:8]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runi
          POSTGRES_PASSWORD: runi
          POSTGRES_DB: runi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runi -d runi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      RUNINATOR_TEST_POSTGRES_URL: postgres://runi:runi@127.0.0.1:5432/runi
      RUNINATOR_TEST_MYSQL_URL: mysql://root:runi@127.0.0.1:3306/runi
      RUNINATOR_TEST_MONGO_URL: mongodb://127.0.0.1:27017/runi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # started by hand rather than as a service: the two images want different env vars and
      # health probes, and `services:` cannot vary those off one matrix axis.
      - name: Start ${{ matrix.mysql_image }}
        run: |
          if [ "${{ matrix.mysql_image }}" = "mysql:8" ]; then
            docker run -d --name ci-mysql -p 3306:3306 \
              -e MYSQL_ROOT_PASSWORD=runi -e MYSQL_DATABASE=runi \
              --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pruni" \
              --health-interval 5s --health-retries 40 mysql:8
          else
            docker run -d --name ci-mysql -p 3306:3306 \
              -e MARIADB_ROOT_PASSWORD=runi -e MARIADB_DATABASE=runi \
              --health-cmd "healthcheck.sh --connect --innodb_initialized" \
              --health-interval 5s --health-retries 40 mariadb:11
          fi
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' ci-mysql)
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          echo "::error::${{ matrix.mysql_image }} never became healthy"
          docker logs ci-mysql
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run live connector tests
        run: cargo test -p runinator-provider-db --test live -- --ignored

      # the store's migrations are dialect-specific sql, and only a live engine runs them:
      # `migration_parity_tests` compares version *sets*, not content. the main test job covers
      # mariadb alone, so a statement mysql 8 rejects and mariadb accepts — a literal DEFAULT on a
      # TEXT column — sat broken from june to august with every job green. this is the only job
      # holding both images, so it is the only place that difference can show up.
      - name: Run store migrations against ${{ matrix.mysql_image }}
        run: |
          # -e is the runner's default, but stated here so the failing `cargo test` aborts the step
          # rather than falling through to the guard below, which would exit 0 on its own.
          set -eo pipefail
          log="${RUNNER_TEMP:-/tmp}/store-mysql.log"
          cargo test -p runinator-database mysql -- --nocapture 2>&1 | tee "$log"

          # the suite self-skips into a green run when the url is unset, so a passing exit code
          # alone does not mean a migration was ever applied.
          if grep -q "skipping: set RUNINATOR_TEST_MYSQL_URL" "$log"; then
            echo "::error::store mysql suite skipped itself - the service or env var is wrong, so this job proved nothing"
            exit 1
          fi

  # the kafka and rabbitmq suites are the only backend tests that need a live broker, so they are
  # `#[ignore]`d and no job ran them. worse than unrun: their helpers return early when the env var
  # is absent, so the tests report "ok" while asserting nothing — which is how both files came to
  # sit with stale broker payload literals unnoticed. the guard on the final step is what makes
  # this job mean something; without it a wrong env var name would leave 11 green tests that never
  # touched a broker.
  broker-backends:
    name: Broker backends
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      RUNINATOR_KAFKA_BOOTSTRAP: 127.0.0.1:9092
      RUNINATOR_RABBITMQ_URI: amqp://guest:guest@127.0.0.1:5672/%2f

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # started by hand rather than as a service: the image ships no HEALTHCHECK, so readiness has
      # to be polled with an admin command, and the topics have to be created after the broker is
      # up — neither of which a `services:` block can express.
      - name: Start Kafka
        run: |
          docker run -d --name ci-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:3.9.0

          for _ in $(seq 1 60); do
            if docker exec ci-kafka /opt/kafka/bin/kafka-topics.sh \
                 --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "${ready:-0}" != "1" ]; then
            echo "::error::kafka never became ready"
            docker logs ci-kafka
            exit 1
          fi

          # the suite names fixed topics and does not create them itself.
          for topic in runinator.control runinator.agent runinator.effects runinator.effects.infrastructure runinator.effect-results runinator.wake runinator.ingress; do
            docker exec ci-kafka /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server 127.0.0.1:9092 \
              --create --if-not-exists --topic "$topic" --partitions 1 --replication-factor 1
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # rdkafka is pinned to `cmake-build`, so it compiles librdkafka from vendored source. the
      # vendored source includes curl/curl.h even with curl integration disabled.
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            pkg-config

      - name: Run broker backend tests
        run: |
          set -o pipefail
          log="${RUNNER_TEMP:-/tmp}/broker-tests.log"
          cargo test --locked -p runinator-broker --features kafka,rabbitmq \
            --test kafka --test rabbitmq -- --ignored --nocapture 2>&1 | tee "$log"

          # the suites self-skip into a green run when a broker is unreachable, so a passing exit
          # code alone does not mean anything was exercised.
          if grep -q "skipping .* integration test" "$log"; then
            echo "::error::broker tests skipped themselves - the services or env vars are wrong, so this job proved nothing"
            exit 1
          fi

  # every job above builds default features, which leaves the opt-in broker backends and the
  # kubernetes provisioner compiled by nobody — including the exact feature set deploy/Dockerfile
  # ships. that gap is not theoretical: the kafka and rabbitmq backends' test files sat with stale
  # payload literals because no job
  # ever built them. `--all-targets` is load-bearing here for that reason — it is what compiles the
  # per-backend integration tests, not just the library.
  #
  # this is a compile check, not a test run: the kafka/rabbitmq suites need live brokers, so they
  # are built and never executed. `ws` is unified on by runinator-desktop-agent's
  # `runinator-worker/ws` forward today, but it is checked explicitly rather than left to depend on
  # one dependency line staying put.
  optional-features:
    name: Optional features
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # rdkafka is pinned to `cmake-build`, so it compiles librdkafka from vendored source rather
      # than looking for a system copy. the source still includes curl/curl.h with curl disabled.
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            pkg-config

      # mirrors deploy/Dockerfile's build line exactly. if this step fails, the container image
      # cannot be built, which no other job would tell us until a release.
      - name: Check deployed feature set (rabbitmq + kubernetes)
        run: |
          cargo check --locked --no-default-features \
            -p runinator-ws \
            -p runinator-engine-worker \
            -p runinator-worker \
            -p runinator-archiver \
            -p runinator-waker \
            -p runinator-ctl \
            -p runinator-bootstrap \
            -p runinator-broker \
            -p runinator-blob \
            --features runinator-ws/postgres,runinator-ws/rabbitmq,runinator-ws/kubernetes,runinator-engine-worker/postgres,runinator-engine-worker/rabbitmq,runinator-worker/rabbitmq,runinator-worker/db-postgres,runinator-waker/rabbitmq,runinator-archiver/postgres,runinator-bootstrap/postgres,runinator-ctl/db-postgres,runinator-broker/tcp,runinator-blob/server

      - name: Check kafka backend
        run: |
          cargo check --locked --all-targets \
            -p runinator-broker \
            -p runinator-ws \
            -p runinator-worker \
            -p runinator-waker \
            -p runinator-engine-worker \
            --features runinator-broker/kafka,runinator-ws/kafka,runinator-worker/kafka,runinator-waker/kafka,runinator-engine-worker/kafka

      - name: Check ws relay backend
        run: |
          cargo check --locked --all-targets \
            -p runinator-broker \
            -p runinator-ws \
            -p runinator-worker \
            --features runinator-broker/ws,runinator-ws/ws,runinator-worker/ws

      # the step above only compiles. the ws client's tls support is a cargo feature of a dependency,
      # so nothing about it fails to build when it is missing — `wss://` is simply refused at runtime,
      # which is every agent behind an ingress. `cargo test --workspace` builds default features and
      # never reaches these, so they have to be run here or they are not run at all.
      - name: Test ws relay backend
        run: cargo test --locked -p runinator-broker --features ws

      # mongo ships as a default feature, so the opt-out path is the one that goes unbuilt.
      - name: Check provider-db without mongo
        run: cargo check --locked --all-targets -p runinator-provider-db --no-default-features

  # the release workflow only runs on dispatch/publish, so a macos- or windows-only compile break
  # would otherwise stay hidden until release day. this is a compile check: nearly every assertion
  # lives in the linux job above. the one exception is `runinator-ctl`, whose output capture moves a
  # standard stream through a different syscall per platform (`dup2` vs `SetStdHandle`) — a compile
  # check would pass just as happily on a redirect that never took effect, so those assertions have
  # to run where the syscall is.
  cross-platform:
    name: Compile ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check workspace
        run: cargo check --workspace --all-targets

      # the console's and the mcp server's capture: see the note on this job. cheap enough (one
      # crate, a couple of seconds) that it is not worth narrowing to a filter that would go stale.
      - name: Test runinator-ctl
        run: cargo test -p runinator-ctl

  command-center:
    name: Command Center
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runinator-command-center

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runinator-command-center/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Type-check and build
        run: pnpm build
