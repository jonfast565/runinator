[package]
name = "xtask"
version.workspace = true
edition = "2024"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
regex = "1"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"] }
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"

runinator-db-cli = { path = "../runinator-db-cli" }
runinator-platform = { path = "../runinator-platform" }
