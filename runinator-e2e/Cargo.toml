[package]
name = "runinator-e2e"
version.workspace = true
edition = "2024"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
runinator-api = { path = "../runinator-api" }
runinator-models = { path = "../runinator-models" }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls-ring", "uuid"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
uuid = { version = "1.26", features = ["v4", "v7"] }
