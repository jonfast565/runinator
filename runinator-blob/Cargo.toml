[package]
name = "runinator-blob"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "runinator-blob"
path = "src/bin/main.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "stream"] }
runinator-blob-core = { path = "../runinator-blob-core" }
runinator-models = { path = "../runinator-models" }
runinator-utilities = { path = "../runinator-utilities" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
