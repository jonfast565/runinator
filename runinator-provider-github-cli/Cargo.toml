[package]
name = "runinator-provider-github-cli"
version.workspace = true
edition = "2024"

[dependencies]
runinator-models = { path = "../runinator-models" }
runinator-plugin = { path = "../runinator-plugin" }
runinator-provider-support = { path = "../runinator-provider-support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1.18", features = ["v4", "v7"] }
