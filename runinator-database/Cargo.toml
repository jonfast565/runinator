[package]
name = "runinator-database"
version.workspace = true
edition = "2024"

[dependencies]
chrono = "0.4"
croner = "4.0.0"
log = "0.4"
futures-util = "0.3.34"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "macros", "migrate", "uuid"] }
sqlx-core = "0.9.0"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1.26", features = ["v4", "v7", "serde"] }

runinator-auth = { path = "../runinator-auth" }
runinator-models = { path = "../runinator-models" }
runinator-store = { path = "../runinator-store" }
runinator-comm = { path = "../runinator-comm" }
runinator-secrets = { path = "../runinator-secrets" }
runinator-scheduling = { path = "../runinator-scheduling" }

[features]
# Production binaries select only the driver they need.
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
mariadb = ["sqlx/mysql"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
runinator-runtime = { path = "../runinator-runtime" }
