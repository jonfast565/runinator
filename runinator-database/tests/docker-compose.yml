# engines for the dialect-parity tests in src/postgres_tests.rs and src/mariadb_tests.rs. the sqlite
# suite needs nothing; these two do, which is why they skip themselves when the urls are unset.
#
# ports are offset from both the defaults and runinator-provider-db's compose, so this can run
# alongside a local install and alongside that crate's suite.
#
#   docker compose -f runinator-database/tests/docker-compose.yml up -d --wait
#   RUNINATOR_TEST_POSTGRES_URL=postgres://runi:runi@127.0.0.1:55433/runi \
#   RUNINATOR_TEST_MARIADB_URL=mysql://root:runi@127.0.0.1:53307/runi \
#     cargo test -p runinator-database
#   docker compose -f runinator-database/tests/docker-compose.yml down -v
#
# each test provisions its own throwaway database on the server and drops it afterwards, so the
# suite is re-runnable without a teardown between runs.

name: runinator-database-tests

services:
  postgres:
    image: postgres:16
    container_name: runi-store-pg
    environment:
      POSTGRES_USER: runi
      POSTGRES_PASSWORD: runi
      POSTGRES_DB: runi
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runi -d runi"]
      interval: 2s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11
    container_name: runi-store-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: runi
      MARIADB_DATABASE: runi
    ports:
      - "53307:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
