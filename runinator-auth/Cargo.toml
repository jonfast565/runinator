[package]
name = "runinator-auth"
version.workspace = true
edition = "2024"

[dependencies]
argon2 = "0.6"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.26", features = ["v4", "v5"] }
runinator-models = { path = "../runinator-models" }
runinator-hash = { path = "../runinator-hash" }
