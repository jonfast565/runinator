[package]
name = "runinator-adapter-client"
version.workspace = true
edition = "2024"

[dependencies]
runinator-adapter-contract = { path = "../runinator-adapter-contract" }
runinator-models = { path = "../runinator-models" }
log = "0.4"
metrics = "0.24"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
tower = { version = "0.5", features = ["util"] }
tower-resilience-circuitbreaker = "0.12.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time"] }
