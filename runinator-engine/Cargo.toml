[package]
name = "runinator-engine"
version.workspace = true
edition = "2024"

[dependencies]
log = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4"] }
tracing = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
opentelemetry = "0.32"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }

runinator-blob-core = { path = "../runinator-blob-core" }
runinator-broker-core = { path = "../runinator-broker-core" }
runinator-runtime = { path = "../runinator-runtime" }
runinator-store = { path = "../runinator-store" }
runinator-compute = { path = "../runinator-compute" }
runinator-models = { path = "../runinator-models" }
runinator-comm = { path = "../runinator-comm" }
runinator-utilities = { path = "../runinator-utilities" }
runinator-console = { path = "../runinator-console" }
runinator-rexrap = { path = "../runinator-rexrap" }
runinator-workflows = { path = "../runinator-workflows" }

[features]
# no broker-backend features here: this crate has no `cfg(feature)` code and depends only on
# `runinator-broker-core` (the trait), so the backend is selected by whichever binary builds it.
# exposes in-crate test hooks (forced-failure injection, small test helpers) to downstream crates
# so their integration tests can drive engine behavior. enabled only via dev-dependencies.
test-support = []

[dev-dependencies]
# Several engine integration tests exercise the durable paths against SQLite. Keep the production
# dependency transport-neutral while enabling that concrete backend only for this crate's tests.
runinator-database = { path = "../runinator-database", default-features = false, features = ["sqlite"] }
