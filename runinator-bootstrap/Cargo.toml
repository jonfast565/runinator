[package]
name = "runinator-bootstrap"
version.workspace = true
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"

runinator-database = { path = "../runinator-database", default-features = false }
runinator-db-cli = { path = "../runinator-db-cli", default-features = false }
runinator-models = { path = "../runinator-models" }
runinator-platform = { path = "../runinator-platform" }

[features]
default = ["sqlite"]
sqlite = ["runinator-database/sqlite", "runinator-db-cli/sqlite"]
postgres = ["runinator-database/postgres", "runinator-db-cli/postgres"]
mysql = ["runinator-database/mysql", "runinator-db-cli/mysql"]

[[bin]]
name = "runinator-bootstrap"
path = "src/main.rs"
