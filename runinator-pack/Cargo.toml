[package]
name = "runinator-pack"
version.workspace = true
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
runinator-models = { path = "../runinator-models" }
runinator-provider-catalog = { path = "../runinator-provider-catalog" }
runinator-wdl = { path = "../runinator-wdl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.18"
zip = { version = "7.2", default-features = false }

[dev-dependencies]
runinator-workflows = { path = "../runinator-workflows" }
