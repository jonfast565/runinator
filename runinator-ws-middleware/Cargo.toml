[package]
name = "runinator-ws-middleware"
version.workspace = true
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
tower = { version = "0.5", features = ["limit", "load-shed"] }
tower-http = { version = "0.6.2", features = ["cors", "catch-panic", "timeout"] }
uuid = { version = "1.18", features = ["v4"] }

runinator-auth = { path = "../runinator-auth" }
runinator-database = { path = "../runinator-database", default-features = false }
runinator-engine = { path = "../runinator-engine" }
runinator-models = { path = "../runinator-models" }
runinator-ws-core = { path = "../runinator-ws-core" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# `ServiceExt::oneshot` for driving a router directly in the overload-protection tests.
tower = { version = "0.5", features = ["util"] }
