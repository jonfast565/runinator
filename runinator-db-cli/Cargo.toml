[package]
name = "runinator-db-cli"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["fs"] }
runinator-database = { path = "../runinator-database", default-features = false }

[features]
sqlite = ["runinator-database/sqlite"]
postgres = ["runinator-database/postgres"]
mysql = ["runinator-database/mysql"]
