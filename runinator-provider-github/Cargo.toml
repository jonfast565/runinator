[package]
name = "runinator-provider-github"
version.workspace = true
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

runinator-github = { path = "../runinator-github" }
runinator-plugin = { path = "../runinator-plugin" }
runinator-models = { path = "../runinator-models" }
runinator-provider-support = { path = "../runinator-provider-support" }
runinator-provider-github-cli = { path = "../runinator-provider-github-cli" }

[dev-dependencies]
uuid = { version = "1.26", features = ["v4", "v7"] }
