[package]
name = "runinator-observability"
version.workspace = true
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
http = "1"
log = "0.4"
nvml-wrapper = "0.13"
opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.32"
opentelemetry-http = "0.32"
opentelemetry-otlp = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-semantic-conventions = "0.32"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
runinator-models = { path = "../runinator-models" }
serde_json = "1"
sysinfo = "0.39"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
uuid = { version = "1.26", features = ["v7"] }
