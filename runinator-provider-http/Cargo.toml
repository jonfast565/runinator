[package]
name = "runinator-provider-http"
version.workspace = true
edition = "2024"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "blocking", "query"] }
runinator-models = { path = "../runinator-models" }
runinator-plugin = { path = "../runinator-plugin" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
