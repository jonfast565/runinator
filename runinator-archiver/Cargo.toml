[package]
name = "runinator-archiver"
version.workspace = true
edition = "2024"

[dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1"
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
uuid = { version = "1.18", features = ["v4", "v7"] }

runinator-broker = { path = "../runinator-broker", default-features = false }
runinator-comm = { path = "../runinator-comm" }
runinator-database = { path = "../runinator-database", default-features = false }
runinator-db-cli = { path = "../runinator-db-cli", default-features = false }
runinator-models = { path = "../runinator-models" }
runinator-observability = { path = "../runinator-observability" }
runinator-platform = { path = "../runinator-platform" }
runinator-store = { path = "../runinator-store" }

[features]
default = ["sqlite", "http", "tcp", "ws"]
sqlite = ["runinator-database/sqlite", "runinator-db-cli/sqlite"]
postgres = ["runinator-database/postgres", "runinator-db-cli/postgres"]
mysql = ["runinator-database/mysql", "runinator-db-cli/mysql"]
http = ["runinator-broker/http"]
tcp = ["runinator-broker/tcp"]
kafka = ["runinator-broker/kafka"]
rabbitmq = ["runinator-broker/rabbitmq"]
ws = ["runinator-broker/ws"]
