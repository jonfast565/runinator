apiVersion: v1
kind: ConfigMap
metadata:
  name: runinator-prometheus-config
  namespace: runinator
  labels:
    app.kubernetes.io/part-of: runinator
    app.kubernetes.io/component: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      # the otlp metrics pushed by ws/worker/waker, re-exposed by the collector's prometheus exporter.
      - job_name: runinator-otlp
        static_configs:
          - targets: ["runinator-otel-collector.runinator.svc.cluster.local:8889"]
      # the collector's own pipeline telemetry (throughput, refused/dropped points).
      - job_name: otel-collector
        static_configs:
          - targets: ["runinator-otel-collector.runinator.svc.cluster.local:8888"]
  alerts.yml: |
    groups:
      - name: runinator-operations
        rules:
          - alert: RuninatorBackgroundLoopStale
            expr: time() - max by (loop) ({__name__=~"runinator_engine_loop_last_success_unixtime.*",loop=~"wake_publisher|action_dispatch|agent_directive|trigger_poll|notification_scanner|ingress|results|operational_metrics"}) > 180
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "Runinator background loop {{ $labels.loop }} is stale"
          - alert: RuninatorQueueAgeGrowing
            expr: max by (queue) ({__name__=~"runinator_engine_queue_oldest_age_seconds.*",queue=~"ready_due|action_dispatch|agent_directive|notification_delivery|ingress_retry|result_retry"}) > 120
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Runinator queue {{ $labels.queue }} has old work"
          - alert: RuninatorNoWorkerCapacity
            expr: absent({__name__=~"runinator_worker_capacity.*"}) or sum({__name__=~"runinator_worker_capacity.*"}) < 1
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "Runinator has no reported worker capacity"
          - alert: RuninatorBrokerDisconnected
            expr: min by (backend) ({__name__=~"runinator_broker_connection_state.*"}) == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "Runinator broker backend {{ $labels.backend }} is disconnected"
          - alert: RuninatorReplicaHeartbeatStale
            expr: max by (kind) ({__name__=~"runinator_engine_replica_max_heartbeat_age_seconds.*",kind=~"worker|waker|webservice|background"}) > 60
            for: 2m
            labels: { severity: warning }
            annotations:
              summary: "Runinator {{ $labels.kind }} heartbeat is stale"
          - alert: RuninatorHttpErrorsHigh
            expr: sum(rate({__name__=~"runinator_ws_http_requests.*",status_class="5xx"}[5m])) / clamp_min(sum(rate({__name__=~"runinator_ws_http_requests.*"}[5m])), 0.001) > 0.05
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Runinator HTTP 5xx ratio exceeds 5%"
          - alert: RuninatorResultPublishingFailed
            expr: sum(rate({__name__=~"runinator_worker_result_publish.*",outcome="error"}[5m])) > 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "Runinator workers cannot publish results"
          - alert: RuninatorDeadLettersCreated
            expr: sum(increase(label_replace({__name__=~"runinator_ws_.*dead_lettered.*"}, "metric", "$1", "__name__", "(.+)")[5m:])) > 0
            labels: { severity: critical }
            annotations:
              summary: "Runinator created dead-letter records"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runinator-prometheus
  namespace: runinator
  labels:
    app.kubernetes.io/part-of: runinator
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runinator-prometheus
  template:
    metadata:
      labels:
        app: runinator-prometheus
        app.kubernetes.io/part-of: runinator
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: prometheus
          # stores samples in an emptyDir; fine for viewing, not for long retention.
          image: prom/prometheus:v3.1.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=6h"
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: runinator-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: runinator-prometheus
  namespace: runinator
  labels:
    app.kubernetes.io/part-of: runinator
    app.kubernetes.io/component: observability
spec:
  selector:
    app: runinator-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
