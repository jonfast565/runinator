apiVersion: v1
kind: ConfigMap
metadata:
  name: runinator-grafana-datasources
  namespace: runinator
  labels:
    app.kubernetes.io/part-of: runinator
    app.kubernetes.io/component: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://runinator-prometheus.runinator.svc.cluster.local:9090
        isDefault: true
      - name: Jaeger
        type: jaeger
        uid: jaeger
        access: proxy
        url: http://runinator-jaeger.runinator.svc.cluster.local:16686
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://runinator-loki.runinator.svc.cluster.local:3100
        jsonData:
          derivedFields:
            - datasourceUid: jaeger
              matcherRegex: 'trace_id[=":]+([0-9a-fA-F-]+)'
              name: trace_id
              url: "$${__value.raw}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runinator-grafana-dashboards-provider
  namespace: runinator
  labels:
    app.kubernetes.io/part-of: runinator
    app.kubernetes.io/component: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: runinator
        orgId: 1
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runinator-grafana-dashboard-overview
  namespace: runinator
  labels:
    app.kubernetes.io/part-of: runinator
    app.kubernetes.io/component: observability
data:
  # queries match metric names by regex so the dashboard survives the collector's prometheus
  # naming (unit/_total suffixes) without needing exact names.
  overview.json: |
    {
      "uid": "runinator-overview",
      "title": "Runinator Overview",
      "schemaVersion": 39,
      "version": 2,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Result events / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (metric) (rate(label_replace({__name__=~\"runinator_ws_result_events.*\"}, \"metric\", \"$1\", \"__name__\", \"(.+)\")[5m:]))",
              "legendFormat": "{{metric}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Collector accepted metric points / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(otelcol_receiver_accepted_metric_points_total[5m]))",
              "legendFormat": "accepted"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Handler panics (total)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 9 },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum({__name__=~\"runinator_ws_handler_panics.*\"})"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Background loop failures (total)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 9 },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum({__name__=~\"runinator_ws_background_loop_failures.*\"})"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Dead-lettered result events (total)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 9 },
          "fieldConfig": {
            "defaults": {
              "noValue": "0",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum({__name__=~\"runinator_ws_result_events_dead_lettered.*\"})"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Worker actions / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 15 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (outcome) (rate({__name__=~\"runinator_worker_actions_completed.*\"}[5m]))",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Worker actions in flight",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 15 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum({__name__=~\"runinator_worker_actions_in_flight.*\"})",
              "legendFormat": "in flight"
            }
          ]
        },
        {
          "id": 25,
          "type": "timeseries",
          "title": "Worker action outcomes / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 91 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (outcome) (rate({__name__=~\"runinator_worker_actions_completed.*\"}[5m]))",
              "legendFormat": "{{outcome}}"
            },
            {
              "refId": "B",
              "expr": "sum by (outcome) (rate({__name__=~\"runinator_worker_result_publish.*\"}[5m]))",
              "legendFormat": "publish {{outcome}}"
            }
          ]
        },
        {
          "id": 26,
          "type": "timeseries",
          "title": "Worker action queue wait p95 (ms)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 91 },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate({__name__=~\"runinator_worker_action_queue_wait_ms.*_bucket\"}[5m])))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Waker wakes / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 24 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (metric) (rate(label_replace({__name__=~\"runinator_waker_wakes.*\"}, \"metric\", \"$1\", \"__name__\", \"(.+)\")[5m:]))",
              "legendFormat": "{{metric}}"
            }
          ]
        },
        {
          "id": 27,
          "type": "timeseries",
          "title": "Waker timing p95 (ms)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 100 },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate({__name__=~\"runinator_waker_wake_lead_ms.*_bucket\"}[5m])))",
              "legendFormat": "lead p95"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate({__name__=~\"runinator_waker_due_lag_ms.*_bucket\"}[5m])))",
              "legendFormat": "due lag p95"
            }
          ]
        },
        {
          "id": 28,
          "type": "timeseries",
          "title": "Waker retries and drive failures / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 100 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (metric) (rate(label_replace({__name__=~\"runinator_waker_wakes_requeued.*|runinator_waker_drive_failures.*\"}, \"metric\", \"$1\", \"__name__\", \"(.+)\")[5m:]))",
              "legendFormat": "{{metric}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Broker operations / sec by channel",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 24 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (channel) (rate({__name__=~\"runinator_broker_operations.*\"}[5m]))",
              "legendFormat": "{{channel}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Reducer drive p95 (ms)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 33 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le) (rate({__name__=~\"runinator_ws_reducer_drive_ms.*_bucket\"}[5m])))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Broker publish p95 (ms) by channel",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 33 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le, channel) (rate({__name__=~\"runinator_broker_operation_duration_ms.*_bucket\", op=\"publish\"}[5m])))",
              "legendFormat": "{{channel}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Service uptime (seconds)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 42 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 300 },
                  { "color": "green", "value": 3600 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [{ "refId": "A", "expr": "max by (service) ({__name__=~\"runinator_process_uptime_seconds.*\"})", "legendFormat": "{{service}}" }]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "HTTP requests / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 42 },
          "targets": [{ "refId": "A", "expr": "sum by (status_class) (rate({__name__=~\"runinator_ws_http_requests.*\"}[5m]))", "legendFormat": "{{status_class}}" }]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "HTTP p95 latency (ms)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 42 },
          "targets": [{ "refId": "A", "expr": "histogram_quantile(0.95, sum by (le, route) (rate({__name__=~\"runinator_ws_http_request_duration_ms.*_bucket\"}[5m])))", "legendFormat": "{{route}}" }]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Durable queue depth",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 50 },
          "targets": [{ "refId": "A", "expr": "sum by (queue) ({__name__=~\"runinator_engine_queue_depth.*\"})", "legendFormat": "{{queue}}" }]
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Oldest queued item (seconds)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 50 },
          "targets": [{ "refId": "A", "expr": "max by (queue) ({__name__=~\"runinator_engine_queue_oldest_age_seconds.*\"})", "legendFormat": "{{queue}}" }]
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Background loop freshness (seconds)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 58 },
          "targets": [{ "refId": "A", "expr": "time() - max by (loop) ({__name__=~\"runinator_engine_loop_last_success_unixtime.*\"})", "legendFormat": "{{loop}}" }]
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "Background loop failures / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 58 },
          "targets": [{ "refId": "A", "expr": "sum by (loop) (rate({__name__=~\"runinator_engine_loop_iterations.*\", outcome=\"error\"}[5m]))", "legendFormat": "{{loop}}" }]
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Replica fleet",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 66 },
          "targets": [{ "refId": "A", "expr": "sum by (kind, status) ({__name__=~\"runinator_engine_replicas.*\"})", "legendFormat": "{{kind}} {{status}}" }]
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "Maximum replica heartbeat age (seconds)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 66 },
          "targets": [{ "refId": "A", "expr": "max by (kind) ({__name__=~\"runinator_engine_replica_max_heartbeat_age_seconds.*\"})", "legendFormat": "{{kind}}" }]
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "Worker capacity and utilization",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 74 },
          "targets": [
            { "refId": "A", "expr": "sum({__name__=~\"runinator_worker_capacity.*\"})", "legendFormat": "capacity" },
            { "refId": "B", "expr": "sum({__name__=~\"runinator_worker_actions_in_flight.*\"})", "legendFormat": "in flight" }
