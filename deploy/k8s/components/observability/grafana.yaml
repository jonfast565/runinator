          "id": 38,
          "type": "timeseries",
          "title": "Engine loop duration p95 (ms)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 140 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.95, sum by (le, loop) (rate({__name__=~\"runinator_engine_loop_duration_ms.*_bucket\"}[5m])))", "legendFormat": "{{loop}}" }
          ]
        },
        {
          "id": 39,
          "type": "timeseries",
          "title": "Replica transitions / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 148 },
          "targets": [
            { "refId": "A", "expr": "sum by (kind, transition) (rate({__name__=~\"runinator_engine_replica_transitions.*\"}[5m]))", "legendFormat": "{{kind}} {{transition}}" }
          ]
        },
        {
          "id": 40,
          "type": "timeseries",
          "title": "Broker connection state",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 148 },
          "targets": [
            { "refId": "A", "expr": "min by (backend) ({__name__=~\"runinator_broker_connection_state.*\"})", "legendFormat": "{{backend}}" }
          ]
        },
        {
          "id": 41,
          "type": "timeseries",
          "title": "Collector accepted / refused / dropped points / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 156 },
          "targets": [
            { "refId": "A", "expr": "sum(rate({__name__=~\"otelcol_receiver_accepted_metric_points.*\"}[5m]))", "legendFormat": "accepted" },
            { "refId": "B", "expr": "sum(rate({__name__=~\"otelcol_receiver_refused_metric_points.*\"}[5m]))", "legendFormat": "refused" },
            { "refId": "C", "expr": "sum(rate(label_replace({__name__=~\"otelcol_processor_dropped_metric_points.*|otelcol_exporter_send_failed_metric_points.*\"}, \"metric\", \"$1\", \"__name__\", \"(.+)\")[5m:]))", "legendFormat": "dropped/failed" }
          ]
        },
        {
          "id": 42,
          "type": "timeseries",
          "title": "Broker operations / sec by outcome",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 156 },
          "targets": [
            { "refId": "A", "expr": "sum by (outcome) (rate({__name__=~\"runinator_broker_operations.*\"}[5m]))", "legendFormat": "{{outcome}}" }
          ]
        },
        {
          "id": 43,
          "type": "timeseries",
          "title": "Worker action duration p95 (ms)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 164 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.95, sum by (le, outcome) (rate({__name__=~\"runinator_worker_action_duration_ms.*_bucket\"}[5m])))", "legendFormat": "{{outcome}}" }
          ]
        },
        {
          "id": 44,
          "type": "timeseries",
          "title": "Worker received vs completed / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 164 },
          "targets": [
            { "refId": "A", "expr": "sum(rate({__name__=~\"runinator_worker_actions_received.*\"}[5m]))", "legendFormat": "received" },
            { "refId": "B", "expr": "sum(rate({__name__=~\"runinator_worker_actions_completed.*\"}[5m]))", "legendFormat": "completed" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runinator-grafana
  namespace: runinator
  labels:
    app.kubernetes.io/part-of: runinator
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runinator-grafana
  template:
    metadata:
      labels:
        app: runinator-grafana
        app.kubernetes.io/part-of: runinator
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            # anonymous admin so the local stack needs no login. lock this down for shared clusters.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: datasources
          configMap:
            name: runinator-grafana-datasources
        - name: dashboards-provider
          configMap:
            name: runinator-grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: runinator-grafana-dashboard-overview
---
apiVersion: v1
kind: Service
metadata:
  name: runinator-grafana
  namespace: runinator
  labels:
    app.kubernetes.io/part-of: runinator
    app.kubernetes.io/component: observability
spec:
  selector:
    app: runinator-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
