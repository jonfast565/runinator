          "title": "Result consumer outcomes / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 132 },
          "targets": [
            { "refId": "A", "expr": "sum by (metric) (rate(label_replace({__name__=~\"runinator_ws_result_events_applied.*|runinator_ws_result_events_duplicate.*|runinator_ws_result_events_retried.*|runinator_ws_result_receive_errors.*\"}, \"metric\", \"$1\", \"__name__\", \"(.+)\")[5m:]))", "legendFormat": "{{metric}}" }
