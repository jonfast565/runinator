          ]
        },
        {
          "id": 31,
          "type": "timeseries",
          "title": "HTTP requests in flight",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 116 },
          "targets": [
            { "refId": "A", "expr": "sum({__name__=~\"runinator_ws_http_requests_in_flight.*\"})", "legendFormat": "in flight" }
          ]
        },
        {
          "id": 32,
          "type": "timeseries",
          "title": "HTTP request rejections / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 116 },
          "targets": [
            { "refId": "A", "expr": "sum by (reason) (rate({__name__=~\"runinator_ws_request_rejections.*\"}[5m]))", "legendFormat": "{{reason}}" }
          ]
        },
        {
          "id": 33,
          "type": "timeseries",
          "title": "WebSocket connections",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 124 },
          "targets": [
            { "refId": "A", "expr": "sum({__name__=~\"runinator_ws_websocket_connections$|runinator_ws_websocket_connections_total\"})", "legendFormat": "connections" }
          ]
        },
        {
          "id": 34,
          "type": "timeseries",
          "title": "Ingress outcomes / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 124 },
          "targets": [
            { "refId": "A", "expr": "sum by (metric) (rate(label_replace({__name__=~\"runinator_ws_ingress_applied.*|runinator_ws_ingress_retried.*|runinator_ws_ingress_dead_lettered.*\"}, \"metric\", \"$1\", \"__name__\", \"(.+)\")[5m:]))", "legendFormat": "{{metric}}" }
