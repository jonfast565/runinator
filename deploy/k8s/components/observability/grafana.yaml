        {
          "id": 29,
          "type": "timeseries",
          "title": "Worker duplicate and lease contention / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 108 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (metric) (rate(label_replace({__name__=~\"runinator_worker_actions_duplicate.*|runinator_worker_actions_replayed.*|runinator_worker_lease_contention.*\"}, \"metric\", \"$1\", \"__name__\", \"(.+)\")[5m:]))",
              "legendFormat": "{{metric}}"
            }
          ]
        },
        {
          "id": 30,
          "type": "timeseries",
          "title": "Worker control and secret-resolution failures / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 108 },
