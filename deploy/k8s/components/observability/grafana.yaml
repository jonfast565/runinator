        {
          "id": 24,
          "type": "timeseries",
          "title": "Cleanup and dead-letter activity / sec",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 82 },
          "targets": [
            { "refId": "A", "expr": "sum by (job) (rate({__name__=~\"runinator_engine_cleanup.*\"}[5m]))", "legendFormat": "cleanup {{job}}" },
