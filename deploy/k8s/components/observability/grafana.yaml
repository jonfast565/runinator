          "title": "WebSocket connections",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 74 },
          "targets": [{ "refId": "A", "expr": "sum by (kind) ({__name__=\"runinator_ws_websocket_connections\"})", "legendFormat": "{{kind}}" }]
