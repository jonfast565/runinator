            { "refId": "A", "expr": "sum by (queue) (rate({__name__=~\"runinator_engine_queue_claimed.*\"}[5m]))", "legendFormat": "claimed {{queue}}" },
            { "refId": "B", "expr": "sum by (queue, operation) (rate({__name__=~\"runinator_engine_queue_failures.*\"}[5m]))", "legendFormat": "failed {{queue}} {{operation}}" }
          ]
