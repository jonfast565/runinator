# Standalone durable orchestration engine, split out of ws so HTTP replicas and engine replicas
# scale independently. The engine talks to postgres + rabbitmq directly (not the ws HTTP API) and
# is multi-replica safe: durable claims/leases (FOR UPDATE SKIP LOCKED), shared-group result/ingress
# consumers, broker-deduped wakes, and the idempotent per-window usage sampler. ws runs with
# RUNINATOR_WS_RUN_ENGINE=false so exactly one tier owns the loops.
#
# Headless Service so the pods have a resolvable DNS name to advertise to the replica list. Nothing
# dials into them, so this exists purely for discovery/observability, not load balancing.
apiVersion: v1
kind: Service
metadata:
  name: runinator-engine-worker
  namespace: runinator
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: runinator-engine-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runinator-engine-worker
  namespace: runinator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runinator-engine-worker
  template:
    metadata:
      labels:
        app: runinator-engine-worker
    spec:
      containers:
        - name: engine-worker
          image: runinator-engine-worker:dev
          imagePullPolicy: IfNotPresent
          command: ["runinator-engine-worker"]
          args:
            - "--database"
            - "postgres"
            - "--database-url"
            - "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - "--instance-id"
            - "$(POD_NAME)"
            - "--broker-backend"
            - "rabbitmq"
            - "--broker-endpoint"
            - "amqp://$(RABBIT_USER):$(RABBIT_PASS)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)/%2f"
            - "--broker-client-id"
            - "runinator-engine-worker-$(POD_NAME)"
          env:
            - name: RUNINATOR_ADAPTER_HOST_URL
              value: "http://127.0.0.1:8790"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: runinator-common
            - secretRef:
                name: runinator-postgres-secret
            - secretRef:
                name: runinator-rabbitmq-secret
            - secretRef:
                name: runinator-app-secret
            - secretRef:
                name: runinator-blob-secret
            - secretRef:
                name: runinator-adapter-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
        # the adapter host loads and runs orchestration adapter code, so it binds loopback only and
        # is reached over the pod's shared network namespace rather than a Service. the main
        # container calls it for the kind catalog, webhook verification, adapter tests, and the
        # engine's durable adapter polling.
        - name: adapter-host
          image: runinator-adapter-host:dev
          imagePullPolicy: IfNotPresent
          command: ["runinator-adapter-host"]
          env:
            - name: RUNINATOR_ADAPTER_HOST_PORT
              value: "8790"
          envFrom:
            - secretRef:
                name: runinator-adapter-secret
          # exec, not httpGet: the host binds loopback only (it is the process that loads adapter
          # code), and a kubelet httpGet dials the pod IP, which such a listener refuses. an exec
          # probe runs inside the container's namespace, so it reaches 127.0.0.1 the same way the
          # sibling container does. `wget` is busybox's, from the shared alpine runtime base.
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "-", "http://127.0.0.1:8790/live"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["wget", "-q", "-O", "-", "http://127.0.0.1:8790/live"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
