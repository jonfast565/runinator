apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runinator-archive-data
  namespace: runinator
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runinator-archiver
  namespace: runinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runinator-archiver
  template:
    metadata:
      labels:
        app: runinator-archiver
    spec:
      # the archive volume is created root-owned and the image runs as the unprivileged `runinator`
      # user (gid 101), so without this every pass dies on "failed to write archive file(s):
      # Permission denied" and nothing is ever pruned -- the tables the archiver exists to bound
      # just grow. fsGroup makes the kubelet hand the volume to the group the container already
      # runs as. it covers volume types the kubelet manages ownership for, which is the PVC below;
      # the local overlay swaps in a hostPath, which fsGroup does not reach, and chowns it instead.
      securityContext:
        fsGroup: 101
      containers:
        - name: archiver
          image: runinator-archiver:dev
          imagePullPolicy: IfNotPresent
          command: ["runinator-archiver"]
          args:
            - "--database"
            - "postgres"
            - "--database-url"
            - "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - "--archive-dir"
            - "/var/lib/runinator/archive"
            - "--broker-backend"
            - "rabbitmq"
            - "--broker-endpoint"
            - "amqp://$(RABBIT_USER):$(RABBIT_PASS)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)/%2f"
            - "--broker-client-id"
            - "runinator-archiver-$(POD_NAME)"
            - "--advertise-host"
            - "$(POD_NAME)"
          envFrom:
            - configMapRef:
                name: runinator-common
            - secretRef:
                name: runinator-postgres-secret
            - secretRef:
                name: runinator-rabbitmq-secret
            - secretRef:
                name: runinator-app-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: archive-data
              mountPath: /var/lib/runinator/archive
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: archive-data
          persistentVolumeClaim:
            claimName: runinator-archive-data
