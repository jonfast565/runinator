apiVersion: v1
kind: ConfigMap
metadata:
  name: runinator-common
  namespace: runinator
data:
  RUNINATOR_LOG: "info"
  RUST_BACKTRACE: "1"
  WS_API_BASE_URL: "http://runinator-ws.runinator.svc.cluster.local:8080/"
  POSTGRES_HOST: "runinator-postgres.runinator.svc.cluster.local"
  POSTGRES_PORT: "5432"
  RABBITMQ_HOST: "runinator-rabbitmq.runinator.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  # database connection-pool bounds, applied by every pod that opens a pool (ws, background,
  # archiver, db-bootstrap). max-connections is per-pod: keep (pods x this) under the Postgres
  # connection cap. acquire-timeout fails a checkout fast on a saturated pool instead of parking
  # the caller. tune per environment in an overlay.
  RUNINATOR_DB_MAX_CONNECTIONS: "20"
  RUNINATOR_DB_ACQUIRE_TIMEOUT_SECONDS: "30"
  # outbound api-client timeouts, applied by every pod that calls the web service through
  # runinator-api (worker, waker, background, ctl). bound a hung/slow ws so callers fail fast.
  RUNINATOR_API_TIMEOUT_SECONDS: "60"
  RUNINATOR_API_CONNECT_TIMEOUT_SECONDS: "10"
  # the object store. every pod that reads or writes artifacts (ws, background) talks to it; leaving
  # this unset would make each pod fall back to its own local directory, which is exactly the
  # per-replica split the blob service exists to remove.
  RUNINATOR_BLOB_ENDPOINT: "http://runinator-blob.runinator.svc.cluster.local:9000/"
  RUNINATOR_BLOB_REGION: "us-east-1"
