# local development credentials only. Do not reuse these values in shared clusters.
---
apiVersion: v1
kind: Secret
metadata:
  name: runinator-postgres-secret
  namespace: runinator
type: Opaque
stringData:
  POSTGRES_USER: "runinator"
  POSTGRES_PASSWORD: "runinator"
  POSTGRES_DB: "runinator"
---
apiVersion: v1
kind: Secret
metadata:
  name: runinator-rabbitmq-secret
  namespace: runinator
type: Opaque
stringData:
  RABBIT_USER: "runinator"
  RABBIT_PASS: "runinator"
---
# shared by the blob service (which verifies signatures) and every pod that reads or writes
# artifacts (which signs with them). the two must match or every artifact call is a 403.
apiVersion: v1
kind: Secret
metadata:
  name: runinator-blob-secret
  namespace: runinator
type: Opaque
stringData:
  RUNINATOR_BLOB_ACCESS_KEY_ID: "runinator"
  RUNINATOR_BLOB_SECRET_ACCESS_KEY: "runinator-local-development-blob-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: runinator-app-secret
  namespace: runinator
type: Opaque
stringData:
  RUNINATOR_CREDENTIAL_KEY: "runinator-local-development-key"
  # seeds an admin on first bootstrap so the login page is usable in local dev.
  RUNINATOR_AUTH_BOOTSTRAP_ADMIN: "admin:admin"
  RUNINATOR_AUTH_BOOTSTRAP_SERVICE_API_KEY: "localk8s.runinator-local-k8s-service-key"
  RUNINATOR_AUTH_BOOTSTRAP_SERVICE_API_KEY_NAME: "local-k8s-services"
---
apiVersion: v1
kind: Secret
metadata:
  name: runinator-adapter-secret
  namespace: runinator
type: Opaque
stringData:
  # shared bearer for the loopback hop between the adapter-host sidecar and the ws/engine
  # containers in the same pod. it is not an api credential.
  RUNINATOR_ADAPTER_HOST_TOKEN: "runinator-local-development-adapter-token"
